{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h1>注册</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">注册</button>
  </form>
  <p class="muted">已有账号？<a href="{% url 'login' %}">去登录</a></p>
</div>
{% endblock %}
