{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h1>登录</h1>
  {% if form.errors %}<p class="muted">用户名或密码错误，请重试。</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">登录</button>
  </form>
  <p class="muted">没有账号？<a href="{% url 'register' %}">立即注册</a>，或使用 <code>python manage.py createsuperuser</code> 创建管理员。</p>
</div>
{% endblock %}
