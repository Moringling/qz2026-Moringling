{% extends "base.html" %}
{% block title %}上传附件{% endblock %}
{% block content %}
<div class="card">
  <h1>为《{{ article.title }}》上传附件</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">上传</button>
    <a class="btn secondary" href="{{ article.get_url }}">返回</a>
  </form>
</div>
{% endblock %}
