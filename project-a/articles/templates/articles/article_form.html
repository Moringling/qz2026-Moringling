{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">保存</button>
    {% if article %}
      <a class="btn secondary" href="{{ article.get_url }}">取消</a>
    {% else %}
      <a class="btn secondary" href="{% url 'articles:list' %}">取消</a>
    {% endif %}
  </form>
</div>
{% endblock %}
