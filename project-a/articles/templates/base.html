<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}文章管理系统{% endblock %}</title>
  <style>
    :root { --accent: #2b6cb0; --border: #e2e8f0; --muted: #718096; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
           margin: 0; color: #1a202c; background: #f7fafc; line-height: 1.6; }
    header { background: #fff; border-bottom: 1px solid var(--border); }
    .container { max-width: 900px; margin: 0 auto; padding: 0 16px; }
    nav { display: flex; align-items: center; gap: 16px; height: 56px; }
    nav a { color: #2d3748; text-decoration: none; }
    nav a:hover { color: var(--accent); }
    nav .spacer { flex: 1; }
    main { padding: 24px 0 48px; }
    h1, h2, h3 { line-height: 1.3; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 8px;
            padding: 16px; margin-bottom: 16px; }
    .muted { color: var(--muted); font-size: 14px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
             font-size: 12px; background: #edf2f7; color: #2d3748; }
    .badge.draft { background: #edf2f7; }
    .badge.published { background: #c6f6d5; color: #22543d; }
    .badge.archived { background: #feebc8; color: #7b341e; }
    .btn { display: inline-block; padding: 6px 12px; border-radius: 6px;
           border: 1px solid var(--accent); background: var(--accent); color: #fff;
           text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn.secondary { background: #fff; color: var(--accent); }
    .btn.danger { background: #c53030; border-color: #c53030; }
    .btn.small { padding: 2px 8px; font-size: 12px; }
    form p { margin: 0 0 12px; }
    input, textarea, select { width: 100%; padding: 8px; border: 1px solid var(--border);
                              border-radius: 6px; font: inherit; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
    .messages { list-style: none; padding: 0; }
    .messages li { padding: 8px 12px; border-radius: 6px; margin-bottom: 8px;
                   background: #ebf8ff; border: 1px solid #bee3f8; }
    pre { background: #2d3748; color: #f7fafc; padding: 10px; border-radius: 6px;
          overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <a href="{% url 'articles:list' %}"><strong>文章管理系统</strong></a>
      <a href="{% url 'articles:stats' %}">统计</a>
      <span class="spacer"></span>
      {% if user.is_authenticated %}
        <a href="{% url 'articles:create' %}">写文章</a>
        <span class="muted">{{ user.username }}</span>
        <form action="{% url 'logout' %}" method="post" style="margin:0;">
          {% csrf_token %}
          <button class="btn secondary small" type="submit">退出</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">登录</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="container">
  {% if messages %}
    <ul class="messages">
      {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
